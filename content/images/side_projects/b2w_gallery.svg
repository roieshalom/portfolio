<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#eef7f4"/>
  <!-- Stacked card shadow -->
  <rect x="115" y="88" width="370" height="220" rx="14" fill="#c6e4dc"/>
  <rect x="107" y="79" width="370" height="220" rx="14" fill="#daefe9"/>
  <!-- Main flashcard -->
  <rect x="100" y="70" width="400" height="220" rx="14" fill="#fff" stroke="#c2ded6" stroke-width="1.5"/>
  <!-- German word -->
  <text x="300" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1d4e46">die Voraussetzung</text>
  <!-- Divider -->
  <line x1="160" y1="190" x2="440" y2="190" stroke="#e0efeb" stroke-width="1.5"/>
  <!-- English translation -->
  <text x="300" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#3f8a7c" font-style="italic">the prerequisite</text>
  <!-- Progress dots -->
  <circle cx="270" cy="315" r="5" fill="#2a9d8f"/>
  <circle cx="290" cy="315" r="5" fill="#2a9d8f"/>
  <circle cx="310" cy="315" r="5" fill="#2a9d8f"/>
  <circle cx="330" cy="315" r="5" fill="#2a9d8f" opacity="0.3"/>
  <!-- Label -->
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888" letter-spacing="3">B2 WORTSCHATZ</text>
</svg>
