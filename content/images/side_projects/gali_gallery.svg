<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#2e6b4f"/>
  <!-- Player card -->
  <rect x="90" y="70" width="420" height="260" rx="18" fill="#ffffff"/>
  <!-- Tree + title -->
  <text x="300" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#c0392b">🎄 Gali singt 🎵</text>
  <text x="300" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#2e6b4f">Weihnachten</text>
  <!-- Divider -->
  <line x1="140" y1="196" x2="460" y2="196" stroke="#e6b800" stroke-width="2"/>
  <!-- Play button -->
  <circle cx="300" cy="252" r="30" fill="#2e6b4f"/>
  <path d="M291 238 L291 266 L315 252 Z" fill="#ffffff"/>
  <!-- Progress bar -->
  <rect x="150" y="300" width="300" height="6" rx="3" fill="#e6ecea"/>
  <rect x="150" y="300" width="110" height="6" rx="3" fill="#c0392b"/>
  <!-- Label -->
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dceee4" letter-spacing="3">GALI SINGT WEIHNACHTEN</text>
</svg>
